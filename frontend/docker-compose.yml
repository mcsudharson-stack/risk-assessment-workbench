services:

  backend:
    build: .
    container_name: risk-workbench-backend

    command:
      uvicorn src.main:app --host 0.0.0.0 --port 8000

    ports:
      - "8000:8000"

    env_file:
      - .env

  frontend:
    build: .
    container_name: risk-workbench-frontend

    command:
      streamlit run frontend/app.py
      --server.address=0.0.0.0
      --server.port=8501

    ports:
      - "8501:8501"

    env_file:
      - .env

    environment:
      API_BASE_URL: http://backend:8000/api/change-requests

    depends_on:
      - backend